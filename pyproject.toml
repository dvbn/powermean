[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "powermean"
version = "0.1.0a1"
description = "Power-mean regression: PPML, GPML and log-linear models for outcomes with zeros"
readme = "README.md"
authors = [{ name = "David Benatia" }]
license = "BSD-3-Clause"
license-files = ["LICENSE", "src/powermean/_vendor/SKLEARN_COPYING"]
requires-python = ">=3.12"
keywords = ["econometrics", "regression", "PPML", "GPML", "IOLS", "zeros", "proportional effects"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.3.1",
    "pandas>=2.2.3",
    "scipy>=1.15.0",
    "formulaic>=1.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.urls]
Repository = "https://github.com/dvbn/powermean"
Issues = "https://github.com/dvbn/powermean/issues"
Paper = "https://arxiv.org/abs/2203.11820"

[tool.hatch.build.targets.wheel]
packages = ["src/powermean"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]
