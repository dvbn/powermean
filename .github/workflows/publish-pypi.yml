name: Publish approved release to PyPI
run-name: Publish ${{ inputs.release_tag }} to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of a published GitHub Release with approved Powermean distributions
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the approved SHA256SUMS release asset
        required: true
        type: string

permissions: {}
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dvbn/powermean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/powermean/
    permissions:
      contents: read
      id-token: write
    steps:
      # Build and validate distributions separately. This job does not check out
      # or execute package code, and only publishes the previously approved bytes.
      - name: Fetch and verify approved release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          tag_pattern='^v[0-9]+(\.[0-9]+)+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'
          [[ "$RELEASE_TAG" =~ $tag_pattern ]] || { echo 'Expected a version tag such as v0.1.0'; exit 1; }
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Expected a lowercase SHA-256'; exit 1; }
          stage="$(mktemp -d "$RUNNER_TEMP/powermean-pypi.XXXXXX")"
          [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == false ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$stage" \
            --pattern SHA256SUMS --pattern '*.whl' --pattern '*.tar.gz'
          python3 -I - "$stage" "$GITHUB_WORKSPACE/dist" "$RELEASE_TAG" "$MANIFEST_SHA256" <<'PY'
          from hashlib import file_digest, sha256
          from pathlib import Path
          import re
          import shutil
          import sys

          stage, dist = map(Path, sys.argv[1:3])
          version, manifest_sha = sys.argv[3][1:], sys.argv[4]
          sdist = f"powermean-{version}.tar.gz"
          wheel = re.compile(rf"powermean-{re.escape(version)}-[A-Za-z0-9_.-]+\.whl")
          manifest = (stage / "SHA256SUMS").read_bytes()
          if sha256(manifest).hexdigest() != manifest_sha:
              sys.exit("Release manifest does not match the approved digest")

          expected = {}
          for line in manifest.decode("ascii").splitlines():
              entry = re.fullmatch(r"([0-9a-f]{64}) [ *]([A-Za-z0-9_.-]+)", line)
              if not entry:
                  sys.exit("Invalid SHA256SUMS entry")
              digest, name = entry.groups()
              if name in expected or not (name == sdist or wheel.fullmatch(name)):
                  sys.exit("Unexpected or duplicate distribution name")
              expected[name] = digest
          if sdist not in expected or len(expected) < 2:
              sys.exit("Expected one source archive and at least one wheel")
          if {p.name for p in stage.iterdir()} != set(expected) | {"SHA256SUMS"}:
              sys.exit("Release assets do not exactly match the approved manifest")

          for name, digest in expected.items():
              path = stage / name
              if path.is_symlink() or not path.is_file():
                  sys.exit("Distribution is not a regular file")
              with path.open("rb") as stream:
                  if file_digest(stream, "sha256").hexdigest() != digest:
                      sys.exit(f"Checksum mismatch: {name}")
          dist.mkdir()
          for name in sorted(expected):
              shutil.move(stage / name, dist / name)
              print(f"Verified {expected[name]}  {name}")
          PY

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
